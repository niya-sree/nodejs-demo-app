name: CI/CD build and deploy web app

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
      
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run : npm ci

      - name: Run tests
        run: npm test

      - name: Login Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build docker image
        run: docker build -t webapp .

      - name: Tag Docker image
        run: |
          docker tag webapp ${{ secrets.DOCKER_USERNAME }}/webapp:latest
          docker tag webapp ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/webapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}   

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into EC2 & Deploy web app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}

            docker stop web-app || true
            docker rm web-app || true
              
            docker run -d --name web-app -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}
            docker ps       
          
